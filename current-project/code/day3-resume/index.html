<html>
  <head>
    <meta charset="utf-8">
    <title>모의 수행평가(이력서작성)</title>
    <style type="text/css">
      th {color:blue; background-color: yellow;}
    
    </style>
  </head>
  <body>
   <form method="post">
    <table border="1" width="1200px">
        <tr>
            <th rowspan="5">인<br>적<br>사<br>항</th>
            <td rowspan="5">
                <img src="PfDog.jpg" width="100px" height="130px">  
            </td>
            <th rowspan="3">성명</th>
            <th>한글</th>
            <td><input type="text" maxlength="4"></td>
            <th>업무/지역</th>
            <td colspan="3">
                <select>
                <option value="0">부산</option>
                <option value="1">서울</option>
                <option value="2">대전</option>
                <option value="3">대구</option>
              </select>
            </td>
        </tr>
        <tr>
            <th>영어</th>
            <td><input type="text" maxlength="10"></td>
            <th>주민등록번호</th>
            <td colspan="3"><input type="text" maxlength="6">-<input type="text" maxlength="7"></td>
        </tr>
        <tr>
            <th>한자</th>
            <td><input type="text" maxlength="10"></td>
            <th>성별</th>
            <td>
                <select>
                <option value="0">남자</option>
                <option value="1">여자</option>
              </select>
            </td>
            <th>연령</th>
            <td><input type="text" maxlength="3"></td>
        </tr>
        <tr>
            <th colspan="2">현주소</th>
            <td colspan="6"><input type="text" ></td>
        </tr>
        <tr>
            <th colspan="2">휴대번호</th>
            <td><input type="text" maxlength="3">-<input type="text" maxlength="4"><h>-</h><input type="text" maxlength="4"></td>
            <th>E-mail</th>
            <td colspan="3"><input type="text" maxlength="30"></td>
        </tr>
    </table>


    <br><br>

    <table border="1" width="1200px">
        <tr>
            <th rowspan="4">학<br>력</th>
            <th>기간(년,월)</th>
            <th>출신학교</th>
            <th>전공</th>
            <th>졸업여부</th>
            <th>학위</th>
        </tr>
        <tr>
            <td><input type="date"></td>
            <td><input type="text" ></td>
            <td><input type="text" ></td>
            <td><input type="text" ></td>
            <td><input type="text" ></td>
        </tr>
        <tr>
            <td><input type="date"></td>
            <td><input type="text" ></td>
            <td><input type="text" ></td>
            <td><input type="text" ></td>
            <td><input type="text" ></td>
        </tr>
        <tr>
            <td><input type="date"></td>
            <td><input type="text" ></td>
            <td><input type="text" ></td>
            <td><input type="text" ></td>
            <td><input type="text" ></td>
        </tr>
    </table>

    <br><br>


    <table border="1" width="1200px">
        <tr>
            <th rowspan="3">병<br>역</th>
            <th>군필</th>
            <td><input type="text" ></td>
            <th>면제사유</th>
            <td colspan="3"><input type="text" ></td>
            <th>보훈 대상 여부</th>
        </tr>
        <tr>
            <th>군필</th>
            <td><input type="text" ></td>
            <th>계급</th>
            <td>
                <select>
                <option value="0">병장</option>
                <option value="1">상등</option>
                <option value="2">일등</option>
                <option value="3">이등</option>
              </select>
            </td>
            <th>병과</th>
            <td><input type="text" ></td>
            <th>비대상</th>
        </tr>
        <tr>
           <th colspan="2">복무기간</th>
           <td colspan="5"><input type="date">-<input type="date"> </td>
        </tr>
        <tr>
            <td colspan="8"><button type="submit">작성완료</button>
                <button type="reset">재작성</button></td>
            
        </tr>
    </table>
    <a href="index.html"> 메인으로 가기 </a>
   </form>
  </body>
